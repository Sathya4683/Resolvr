server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    #single page app: unknown paths go to index.html and react-router takes over
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
