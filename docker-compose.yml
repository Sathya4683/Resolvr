name: resolvr

#shared settings for the api and the worker (same image, different command)
x-backend: &backend
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  image: resolvr-api:dev
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-resolvr}:${POSTGRES_PASSWORD:-resolvr}@db:5432/${POSTGRES_DB:-resolvr}
    TEST_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-resolvr}:${POSTGRES_PASSWORD:-resolvr}@db:5432/resolvr_test
    DATA_DIR: /data
    HF_HUB_VERBOSITY: error
  volumes:
    - ./backend:/app
    - ./data:/data:ro
    - model_cache:/models
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resolvr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolvr}
      POSTGRES_DB: ${POSTGRES_DB:-resolvr}
    #log slow queries so they show up in loki
    command: >
      postgres
      -c log_min_duration_statement=250
      -c log_line_prefix='%m [%p] %u@%d '
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    #migrate, load the demo data on first run, then serve with hot reload
    command: >
      sh -c "alembic upgrade head &&
             python -m app.cli seed --if-empty &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --no-access-log"
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      #first boot downloads the embedding models, give it time
      start_period: 600s

  worker:
    <<: *backend
    #restarts itself when python files change, like uvicorn --reload does for the api
    command: watchfiles --filter python "python -m app.worker" app
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    image: resolvr-frontend:dev
    environment:
      VITE_API_URL: http://localhost:8001
    volumes:
      - ./frontend:/app
      #keep the container's own node_modules instead of the host's
      - /app/node_modules
    ports:
      - "5174:5173"
    depends_on:
      - api
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8026:8025"
    restart: unless-stopped

  #---------------- monitoring ----------------
  #ports are bound to localhost only, these dashboards are not meant to be public

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.5
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./configs/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.2
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./configs/alloy/config.alloy:/etc/alloy/config.alloy:ro
      #read-only access to the docker socket so alloy can tail container logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:12346:12345"
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/resolvr.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-resolvr}:${POSTGRES_PASSWORD:-resolvr}@db:5432/${POSTGRES_DB:-resolvr}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  pgdata:
  model_cache:
  prometheus_data:
  loki_data:
  grafana_data:
