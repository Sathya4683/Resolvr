global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  #fastapi app, metrics from app/metrics.py
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  #background worker (batch jobs, digest cron) exposes its own metrics port
  - job_name: worker
    static_configs:
      - targets: ["worker:9101"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
